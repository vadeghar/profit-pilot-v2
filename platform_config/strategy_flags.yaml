# Strategy classification flags - hand-maintained, one entry per STRATEGY_CATALOG id.
#
# The dashboard renders every list below as filter chips (OR within a group,
# AND across groups). `status` is taken from the generated audit
# (platform_config/strategy_audit.json: KEEP -> active, WATCH/EXPERIMENTAL ->
# experimental, DEPRECATE -> deprecated) unless `status_override` is set here.
# Deprecated strategies are hidden on the dashboard unless "Show deprecated" is on.
#
# horizon = what the strategy is built for:
#   Intraday   - positions opened and closed in the same session
#   Short term - swing / positional, days to ~2 months
#   Long term  - held for months

four_indicator_system:
  segment: [Derivative]
  instrument: [Options]
  direction: [Directional]
  bias: [Long/Short]
  hedging: [Unhedged]
  style: [Momentum, Option buying]
  horizon: [Intraday]

