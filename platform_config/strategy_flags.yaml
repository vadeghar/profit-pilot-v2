# Strategy classification flags - hand-maintained, one entry per strategy id on the dashboard.
#
# The dashboard renders every list below as filter chips (OR within a group, AND across groups).
# `status_override` sets the status badge (active / experimental / deprecated); without it a
# strategy is experimental. Deprecated strategies are hidden unless "Show deprecated" is on.
#
# horizon = what the strategy is built for:
#   Intraday   - positions opened and closed in the same session
#   Short term - swing / positional, days to ~2 months
#   Long term  - held for months

# ---- trading_strategies ----
index_oi_momentum:
  status_override: deprecated
  status_reason: "Deprecated by the owner until further notice; no auto-start on app startup. Not part of the tick scalpers."
  segment: [Derivative]
  instrument: [Options]
  direction: [Directional]
  bias: [Long/Short]
  hedging: [Unhedged]
  style: [Momentum, Option buying, Order flow]
  horizon: [Intraday]

