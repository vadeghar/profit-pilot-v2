strategy: nifty_no_brainer_ratio
version: 1
timezone: Asia/Kolkata
rules:
  R1: {requirement: NIFTY index options, monthly expiry only}
  R2: {requirement: last Friday of month, fallback: previous trading day, tag: ASSUMPTION}
  R3: {requirement: entry at 15:16 IST, spot-independent: true}
  R4: {requirement: next month's monthly expiry from contract master, hard_code_weekday: false}
  R5: {requirement: [BUY 1 CE near, SELL 2 CE sell, BUY 1 CE far hedge]}
  R6: {buy_sell_grid: 100}
  R7: {atm: nearest strike, fifty_multiple: next higher 100}
  R8: {near_buy_offset: 300, sell_gap: 300, shift_step: 100}
  R9: {hedge_grid: 500, distance: [800, 1400], target_distance: 1000, tie: farther, tag: AMBIGUOUS_VIDEO_24700}
  R10: {capital_base: broker_margin_whole_structure, log_method: required}
  R11: {premium_band: 0.01, debit_over_band: SKIP_DEBIT, credit_over_band: SHIFT}
  R12: {max_shift_steps: null, hedge_recalc_on_shift: true, max_exhaustion: ABORT, tag: AMBIGUOUS_SOURCE_PARAMETER}
  R13: {target_pct_margin: 0.025}
  R14: {stop_pct_margin: 0.03, gap_through: first_available_fill}
  R15: {max_hold_days: [18, 19], basis: calendar, exit_time: '15:16', tag: ASSUMPTION}
  R16: {adjustments: false, reentry: false, rolling: false, partial_exit: false, one_trade_per_month: true}
  R17: {gap_down_loss: net_debit, gap_up_stop: gap_through}
  R18: {lot_size: contract_master_period_correct, hard_code: false}
  R19: {claim: '+32% Jan-2024 to Nov-2025', use: sanity_check_only}
  R20: {paper_default: true, live_requires_explicit_flag: true, scale: [1-2, 3-5, 5-8, 8-10, 10-12, 12-15]}
parameters:
  HEDGE_RECALC_ON_SHIFT: true
  MAX_HOLD_DAYS: 18
  MAX_SHIFT_STEPS: null
  LIVE_ORDER_PLACEMENT: false
  slippage_points: [0, 1, 2]