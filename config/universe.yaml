  - symbol: NSE:LT
    label: "Larsen & Toubro Ltd"
    exchange: NSE
    type: equity
    description: "L&T — engineering, construction, manufacturing"

# ---------------------------------------------------------------------------
# Per-strategy defaults — which instruments each strategy prefers
# ---------------------------------------------------------------------------
# These are the DEFAULT instruments when no --instrument is specified.
# Override via CLI --instrument or web UI symbol selector.
# ---------------------------------------------------------------------------
strategy_defaults:
  ema_crossover:
    instruments:
      - NSE:NIFTY
    description: "Default benchmark index for EMA crossover"

  rsi:
    instruments:
      - NSE:NIFTY
    description: "Default benchmark index for RSI strategy"

  breakout:
    instruments:
      - NSE:NIFTY
    description: "Default benchmark index for breakout strategy"

  equity_swing_vcp:
    instruments:
      - NSE:RELIANCE
      - NSE:HDFCBANK
      - NSE:ICICIBANK
      - NSE:SBIN
      - NSE:TCS
      - NSE:ITC
      - NSE:TATASTEEL
      - NSE:TATAMOTORS
      - NSE:INFY
    description: "Top equities universe for VCP swing trading"

  lorentzian_ml:
    instruments:
      - NSE:NIFTY
    description: "Default benchmark for Lorentzian ML classification"

  mcx_trend_rider:
    # MCX commodities are NOT in this YAML — they use their own spec file
    # (strategies/mcx_trend_rider.py → COMMODITY_SPECS)
    instruments:
      - MCX:CRUDEOIL
      - MCX:GOLD
      - MCX:SILVER
    description: "MCX commodities — see COMMODITY_SPECS in strategy file"

  index_oi_momentum:
    # Index options strategy — indices only, F&O derived at runtime
    instruments:
      - NSE:NIFTY
      - NSE:BANKNIFTY
      - NSE:SENSEX
    description: "Index OI momentum — indices only, derivatives derived at runtime"
